name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.281
      - name: Run tests
        run: npm test
      - name: Check documentation
        run: npm run docs:check
      - name: Validate skill package
        run: npm run validate:skill
      - name: Validate portable and OpenAI plugin manifests
        run: npm run validate:plugin
      - name: Validate Claude plugin manifests
        run: npm run validate:claude && npm run validate:claude:official
      - name: Build desktop distributions
        run: npm run package:desktop
      - name: Check portable agent installation plan
        run: npm run install:agents -- --scope project --dry-run
